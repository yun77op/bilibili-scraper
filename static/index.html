<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>视频转文章 - Bilibili & YouTube</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260821" />
  </head>
  <body>
    <div id="app" v-cloak>
      <navbar current="index"></navbar>

      <main class="shell">
        <section class="workspace">
          <header class="topbar">
            <div>
              <h1>视频转文章</h1>
              <p>支持 Bilibili、YouTube。优先读取字幕；没有字幕时自动下载音频并转写，再整理成文章。</p>
            </div>
            <div class="topbar-right">
              <div class="worker-status" title="后台 Worker 状态">
                <span class="worker-dot" :class="{ online: workerAlive === true, offline: workerAlive === false }"></span>
                <span class="worker-text">{{ workerText }}</span>
              </div>
              <div class="status-pill">{{ statusPill }}</div>
            </div>
          </header>

          <form class="job-form" @submit.prevent="submit">
            <div class="url-rows">
              <div class="url-row" v-for="(row, i) in rows" :key="i">
                <input
                  class="url-input"
                  type="text"
                  placeholder="粘贴 B站 / YouTube 链接，按回车开始"
                  autocomplete="off"
                  v-model="row.value"
                />
                <button class="url-row-btn add-row" type="button" title="添加一行" @click="addRow">+</button>
                <button
                  class="url-row-btn remove-row"
                  type="button"
                  title="移除此行"
                  @click="removeRow(i)"
                  :style="{ display: rows.length <= 1 ? 'none' : '' }"
                >−</button>
              </div>
            </div>
            <button id="submitBtn" type="submit" :disabled="submitting">
              {{ submitting ? '提交中…' : '全部开始' }}
            </button>
          </form>

          <p id="stageText" aria-label="处理状态">{{ stageText }}</p>

          <section class="job-history">
            <div class="job-history-head">
              <h2>📋 任务历史</h2>
              <span class="job-count">{{ jobCountText }}</span>
            </div>
            <div class="job-list">
              <p class="job-empty" v-if="jobs.length === 0">暂无历史任务</p>
              <job-item v-for="job in jobs" :key="job.id" :job="job" @refresh="loadJobs"></job-item>
            </div>
            <div class="pagination" v-if="pages > 1">
              <button class="page-btn" :disabled="page <= 1" @click="goPage(page - 1)">‹ 上一页</button>
              <template v-for="p in pageItems" :key="p">
                <span v-if="p === '…'" class="page-ellipsis">…</span>
                <button v-else class="page-btn" :class="{ active: p === page }" @click="goPage(p)">{{ p }}</button>
              </template>
              <button class="page-btn" :disabled="page >= pages" @click="goPage(page + 1)">下一页 ›</button>
            </div>
          </section>
        </section>
      </main>
    </div>
    <footer class="build-info">build __BUILD_HASH__</footer>
    <script type="module" src="/static/app.js?v=20260821"></script>
  </body>
</html>
