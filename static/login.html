<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 - 视频转文章</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="auth-body">
    <div id="app">
      <main class="auth-card">
        <h1>视频转文章</h1>
        <p class="auth-sub">Bilibili / YouTube 视频转深度文章</p>
        <form class="auth-form" @submit.prevent="submit">
          <label>
            <span>用户名</span>
            <input type="text" v-model="username" autocomplete="username" required autofocus />
          </label>
          <label>
            <span>密码</span>
            <input type="password" v-model="password" autocomplete="current-password" required />
          </label>
          <p class="auth-error" v-if="error">{{ error }}</p>
          <button type="submit" :disabled="busy">{{ busy ? "登录中…" : "登 录" }}</button>
        </form>
        <p class="auth-switch">还没有账号？<a href="/register">立即注册</a></p>
      </main>
    </div>
    <script type="module" src="/static/login.js"></script>
  </body>
</html>
